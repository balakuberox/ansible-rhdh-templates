apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dbaas-vm-provisioner
  title: Database-as-a-Service (DBaaS)
  description: Automatically provision a dedicated PostgreSQL or MySQL database VM on OpenShift Virtualization via AAP.
  namespace: default
  tags:
    - database
    - openshift
    - dbaas
spec:
  owner: RedHat
  type: service

  parameters:
    - title: Database Specification Details
      description: Provide the parameters for your new database engine
      required:
        - db_type
        - vm_size
        - db_name
        - db_user
        - db_password
      properties:
        db_type:
          title: Database Engine Selection
          type: string
          description: Choose the underlying database core engine type.
          default: postgresql
          enum:
            - postgresql
            - mysql
          enumNames:
            - "PostgreSQL 15"
            - "MySQL / MariaDB"
        vm_size:
          title: Virtual Machine Compute Size
          type: string
          description: Select the CPU/RAM allocation for the underlying OpenShift Virtualization VM.
          default: small
          enum:
            - small
            - medium
            - large
          enumNames:
            - "Small (2 vCPU, 4GB RAM)"
            - "Medium (4 vCPU, 8GB RAM)"
            - "Large (8 vCPU, 16GB RAM)"
        db_name:
          title: Database Name
          type: string
          description: Enter a unique identifier name for the database schema.
          default: app-db
        db_user:
          title: Master Username
          type: string
          default: dbadmin
        db_password:
          title: Master Password
          type: string
          ui:widget: password

  steps:
    - id: launch-dbaas-job
      name: Launch DBaaS Job Template
      action: rhaap:launch-job-template
      input:
        token: ${{ secrets.aapToken }}
        values:
          template: "Database-as-a-Service (DBaaS) Provisioner"
          # Increases the polling timeout window to ensure the portal waits for the VM completion
          timeout: 600 
          extraVariables:
            db_type: ${{ parameters.db_type }}
            vm_size: ${{ parameters.vm_size }}
            db_name: ${{ parameters.db_name }}
            db_user: ${{ parameters.db_user }}
            db_password: ${{ parameters.db_password }}

  output:
    text:
      - title: 'DBaaS Provisioning Completed Successfully! 🎉'
        content: |
          Your request has been successfully executed by the Ansible Automation Platform engine.
          
          ### 🔑 Your Database Connection Strings
          
          Below are the details generated from your deployment playbook tasks:
          
          ```text
          PostgreSQL Standard URL: postgresql://${{ parameters.db_user }}:${{ parameters.db_password }}@${{ steps['launch-dbaas-job'].output.data.artifacts.discovered_ip | default('172.31.60.175') }}:5432/${{ parameters.db_name }}
          
          CLI Command: PGPASSWORD='${{ parameters.db_password }}' psql -h ${{ steps['launch-dbaas-job'].output.data.artifacts.discovered_ip | default('172.31.60.175') }} -U ${{ parameters.db_user }} -d ${{ parameters.db_name }}
          ```
          
          * **Job Execution ID:** `${{ steps['launch-dbaas-job'].output.data.id }}`
          * **Target Inventory Host:** `${{ steps['launch-dbaas-job'].output.data.inventory_host | default('172.31.60.175') }}`
          
    links:
      - title: Open AAP Job Execution Details
        url: ${{ steps['launch-dbaas-job'].output.data.url }}

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dbaas-vm-provisioner
  title: Database-as-a-Service (DBaaS)
  description: Automatically provision a dedicated PostgreSQL or MySQL database VM on OpenShift Virtualization via AAP.
  namespace: default
  tags:
    - database
    - openshift
    - dbaas
spec:
  owner: RedHat
  type: service

  # Cleaned up parameters: Only contains fields your user actually fills out!
  parameters:
    - title: Database Specification Details
      description: Provide the parameters for your new database engine
      required:
        - db_type
        - db_name
        - db_user
        - db_password
      properties:
        db_type:
          title: Database Engine Selection
          type: string
          description: Choose the underlying database core engine type.
          default: postgresql
          enum:
            - postgresql
            - mysql
          enumNames:
            - "PostgreSQL 15"
            - "MySQL / MariaDB"
        db_name:
          title: Database Name
          type: string
          description: Enter a unique identifier name for the database schema.
          default: app-db
        db_user:
          title: Master Username
          type: string
          default: dbadmin
        db_password:
          title: Master Password
          type: string
          ui:widget: password

  steps:
    - id: launch-dbaas-job
      name: Launch DBaaS Job Template
      action: rhaap:launch-job-template
      input:
        # [FIX] Read directly from the secrets object instead of parameters!
        token: ${{ secrets.aapToken }}
        values:
          template: "Database-as-a-Service (DBaaS) Provisioner"
          extraVariables:
            db_type: ${{ parameters.db_type }}
            db_name: ${{ parameters.db_name }}
            db_user: ${{ parameters.db_user }}
            db_password: ${{ parameters.db_password }}

  output:
    text:
      - title: 'DBaaS Provisioning Job Triggered Successfully'
        content: |
          Your request has been successfully routed to the Ansible Automation Platform engine.
          
          **Job Execution ID:** `${{ steps['launch-dbaas-job'].output.data.id }}`
  links:
    - title: View in RH AAP
      url: ${{ steps['launch-dbaas-job'].output.data.url }}

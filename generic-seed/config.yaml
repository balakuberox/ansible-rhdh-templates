apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dbaas-vm-provisioner
  title: Database-as-a-Service (DBaaS)
  description: Automatically provision a dedicated PostgreSQL or MySQL database VM on OpenShift Virtualization via AAP.
  namespace: default
  tags:
    - database
    - openshift
    - dbaas
spec:
  owner: RedHat
  type: service

  parameters:
    - title: Database Specification Details
      description: Provide the parameters for your new database engine
      required:
        - db_type
        - vm_size
        - db_name
        - db_user
        - db_password
      properties:
        db_type:
          title: Database Engine Selection
          type: string
          description: Choose the underlying database core engine type.
          default: postgresql
          enum:
            - postgresql
            - mysql
          enumNames:
            - "PostgreSQL 15"
            - "MySQL / MariaDB"
        vm_size:
          title: Virtual Machine Compute Size
          type: string
          description: Select the CPU/RAM allocation for the underlying OpenShift Virtualization VM.
          default: small
          enum:
            - small
            - medium
            - large
          enumNames:
            - "Small (2 vCPU, 4GB RAM)"
            - "Medium (4 vCPU, 8GB RAM)"
            - "Large (8 vCPU, 16GB RAM)"
        db_name:
          title: Database Name
          type: string
          description: Enter a unique identifier name for the database schema.
          default: app-db
        db_user:
          title: Master Username
          type: string
          default: dbadmin
        db_password:
          title: Master Password
          type: string
          ui:widget: password

  steps:
    - id: launch-dbaas-job
      # [UPDATED HERE] This changes the text above the loading spinner and in the logs!
      name: Creating your Database VM on OpenShift Virtualization...
      action: rhaap:launch-job-template
      input:
        token: ${{ secrets.aapToken }}
        values:
          template: "Database-as-a-Service (DBaaS) Provisioner" 
          extraVariables:
            db_type: ${{ parameters.db_type }}
            vm_size: ${{ parameters.vm_size }}
            db_name: ${{ parameters.db_name }}
            db_user: ${{ parameters.db_user }}
            db_password: ${{ parameters.db_password }}

  output:
    text:
      - title: 'DBaaS Provisioning Requested Successfully.'
        content: |    
          Your custom instance has been successfully provisioned on OpenShift Virtualization.
          
          ### Your Database Connection Summary below
          
          Based on your choices, here are the connection profiles being initialized:
          
          * **Database Engine:** ${{ parameters.db_type }}
          * **Target Schema:** ${{ parameters.db_name }}
          * **Admin Username:** ${{ parameters.db_user }}
          
          #### Standard Connection URL & CLI Commands
          - **Message:** ${{ steps['launch-dbaas-job'].output.data.events[steps['launch-dbaas-job'].output.data.events.length - 1].event_data.artifact_data.db_connection_info }}
          
# - **Job Status:** ${{ steps['launch-dbaas-job'].output.data.events[steps['launch-dbaas-job'].output.data.events.length - 1].event_data.artifact_data.job_status }}
# - **Ran By:** ${{ steps['launch-dbaas-job'].output.data.events[steps['launch-dbaas-job'].output.data.events.length - 1].event_data.artifact_data.ran_by }}
          
          

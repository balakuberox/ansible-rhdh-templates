apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aap-job-runner-with-output
  title: AAP Job Runner (Fetch Output + Artifacts)
  description: Launch AAP job and fetch artifacts after completion
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Provide Details
      properties: {}
  steps:
    - id: launch-job
      name: Launch AAP Job
      action: rhaap:launch-job-template
      input:
        token: ${{ secrets.aapToken }}
        values:
          template: "hello-world"

  output:
    text:
      - title: Job Info
        content: |
          - **Job ID:** ${{ steps['launch-job'].output.data.id }}
          - **Status:** ${{ steps['launch-job'].output.data.status }}
          - **URL:** ${{ steps['launch-job'].output.data.url }}
  
      # ✅ Add this
      - title: Job Artifacts
        content: |
          ${{ steps['launch-job'].output.data.artifacts | dump }}
  
    links:
      - title: Open AAP Job
        url: ${{ steps['launch-job'].output.data.url }}

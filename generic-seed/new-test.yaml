apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ansible-hello-fetcher
  title: Fetch AAP Task Output Portal
  description: Triggers a job and grabs the specific 'Hello Message' string back.
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Provide Details
      properties: {}

  steps:
steps:
  - id: launch-hello-job
    action: rhaap:launch-job-template
    input:
      token: ${{ secrets.aapToken }}
      values:
        template: "Demo Job Template"
  output:
    text:
      - title: Playbook Triggered Successfully!
        content: |
          Your AAP Job ID is: **${{ steps['launch-hello-job'].output.id }}**
          
          You can track the live logs directly in your Ansible Automation Platform dashboard.

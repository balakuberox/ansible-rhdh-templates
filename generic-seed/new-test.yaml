apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aap-job-runner-with-output- new
  title: AAP Job Runner (Fetch Output + Artifacts) New
  description: Launch AAP job and fetch artifacts after completion New
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Provide Details
      properties: {}
  steps:
    - id: launch-job
      name: Launch AAP Job
      action: rhaap:launch-job-template
      input:
        token: ${{ secrets.aapToken }}
        values:
          template: "hello-world"
  output:
    text:
      - title: DEBUG Full Dump
        content: |
          ${{ steps['launch-job'].output.data | dump }}
          
      - title: Job Info
        content: |
          - **Job ID:** ${{ steps['launch-job'].output.data.id }}
          - **Status:** ${{ steps['launch-job'].output.data.status }}
          - **URL:** ${{ steps['launch-job'].output.data.url }}
  
      - title: Job Artifacts
        content: |
          - **Message:** ${{ steps['launch-job'].output.data.events[steps['launch-job'].output.data.events.length - 1].event_data.artifact_data.message }}
          - **Job Status:** ${{ steps['launch-job'].output.data.events[steps['launch-job'].output.data.events.length - 1].event_data.artifact_data.job_status }}
          - **Ran By:** ${{ steps['launch-job'].output.data.events[steps['launch-job'].output.data.events.length - 1].event_data.artifact_data.ran_by }}
  
      # ✅ New tab - renders as a proper markdown table
      - title: Job History
        content: |
          ${{ steps['launch-job'].output.data.events[steps['launch-job'].output.data.events.length - 1].event_data.artifact_data.job_history_table }}
  
    links:
      - title: Open AAP Job
        url: ${{ steps['launch-job'].output.data.url }}
        
